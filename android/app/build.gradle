plugins { id "com.android.application" }
android {
    namespace "za.co.saopportunities.app"
    compileSdk 34
    defaultConfig {
        applicationId "za.co.saopportunities.app"
        minSdk 24; targetSdk 34; versionCode 5; versionName "2.3"
        buildConfigField "String", "JOBS_JSON_URL", "\"https://raw.githubusercontent.com/perfectndumiso1-netizen/VideoGrab/main/data/jobs.json\""
        buildConfigField "String", "OPP_JSON_URL", "\"https://raw.githubusercontent.com/perfectndumiso1-netizen/VideoGrab/main/data/opportunities.json\""
    }
    // Permanent app signing key (dedicated to this sideloaded app, chosen by the
    // project owner and committed so EVERY release is signed identically ->
    // new APKs install as updates over the old app, no uninstall needed).
    // Keep applicationId + this key + increasing versionCode forever.
    // Generate a NEW private key before any Play Store release.
    signingConfigs {
        releaseSign {
            storeFile rootProject.file("signing/sa-opportunities.p12")
            storeType "PKCS12"
            storePassword "167e97a96990523044f45748bfecdf76547d7da55c6cff61"
            keyAlias "saopportunities"
            keyPassword "167e97a96990523044f45748bfecdf76547d7da55c6cff61"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.releaseSign
        }
        debug { applicationIdSuffix "" }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation "androidx.cardview:cardview:1.0.0"
    implementation "androidx.work:work-runtime:2.9.1"
}
