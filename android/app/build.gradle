plugins { id "com.android.application" }
android {
    namespace "za.co.saopportunities.app"
    compileSdk 34
    defaultConfig {
        applicationId "za.co.saopportunities.app"
        minSdk 24; targetSdk 34; versionCode 1; versionName "1.0"
        // After you rename the GitHub repo, update this ONE line to its raw jobs.json URL.
        buildConfigField "String", "JOBS_JSON_URL", "\"https://raw.githubusercontent.com/perfectndumiso1-netizen/VideoGrab/main/data/jobs.json\""
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
