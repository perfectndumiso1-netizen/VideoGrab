name: Build Android APK (debug)
on: [workflow_dispatch, push]
permissions: {contents: write}
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.7"}
      - run: |
          echo "ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDKMGR="$(command -v sdkmanager || find "${ANDROID_HOME:-/usr/lib/android-sdk}" -name sdkmanager -type f 2>/dev/null | head -1)"
          echo "sdkmanager: $SDKMGR"
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
            "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" || true
          fi
          ls "${ANDROID_HOME:-/usr/lib/android-sdk}/platforms"
      - working-directory: android
        run: gradle assembleRelease --stacktrace
      - name: Prepare nicely-named APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/SA-Opportunities.apk
          ls -lh dist/SA-Opportunities.apk
      - uses: actions/upload-artifact@v4
        with: {name: sa-opportunities-debug-apk, path: dist/SA-Opportunities.apk}
      - name: Publish / update GitHub Release with direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.0 dist/SA-Opportunities.apk \
            --title "SA Opportunities v2.0" \
            --notes "SA Opportunities Android app (debug build). Verified SA jobs with official apply links, scam filtering. Install: download SA-Opportunities.apk to your Android phone, open it, and allow 'install unknown apps' for your browser/Files app when asked." \
          || gh release upload v2.0 dist/SA-Opportunities.apk --clobber
          echo "Direct download: https://github.com/${{ github.repository }}/releases/download/v2.0/SA-Opportunities.apk"
