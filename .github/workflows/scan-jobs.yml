name: Scan & verify SA jobs
on:
  schedule: [{cron: "*/15 * * * *"}]   # near-continuous: every 15 min (GitHub may delay a few min under load)
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: scan-jobs, cancel-in-progress: false}
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 backend/scanner.py
      - name: Autopost new verified jobs to Telegram (grouped by category)
        run: python3 backend/telegram_autopost.py --mode new
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Publish results for the app
        run: |
          git config user.name "sa-opportunities-bot"
          git config user.email "actions@github.com"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git add data/jobs.json
          git add data/.autopost.json || true
          git add data/.notified.json || true
          git diff --cached --quiet || git commit -m "Update verified SA jobs"
          git push
